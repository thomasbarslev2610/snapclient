<!DOCTYPE html>
<html>
  <head>
    <title>Snapcast Client</title>
    <style>
   
      h1 {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      input {
        background-color: white;
        margin-left: 1em;
      }
      label {
        color: rgb(27, 0, 94);
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        margin-left: 1em;
      }

      .buttonstyled {
        border: 0;
        line-height: 2.5;
        padding: 0 20px;
        font-size: 1rem;
        text-align: center;
        
        text-shadow: 1px 1px 1px #000;
        border-radius: 10px;
        background-color: rgb(27, 114, 114);
        background-image: linear-gradient(
          to top left,
          rgba(0, 0, 0, 0.2),
          rgba(0, 0, 0, 0.2),
          rgba(0, 0, 0, 0)
        );
        box-shadow: inset 2px 2px 3px rgba(255, 255, 255, 0.6),
          inset -2px -2px 3px rgba(0, 0, 0, 0.6);
      }

      .buttonstyled:hover {
        background-color: rgba(255, 0, 0, 1);
      }

      .buttonstyled:active {
        box-shadow: inset -2px -2px 3px rgba(255, 255, 255, 0.6),
          inset 2px 2px 3px rgba(0, 0, 0, 0.6);
      }
      .setting {
        background-color: rgb(122, 122, 122);
        width: 20em;
        
        padding-top: 1em;
        margin-left:1em;
      }
      .breaker {
        background-color: rgb(122, 122, 122);
        width: 20em;
        padding-top: 1em;
        margin-left:1em;
      }
    </style>
  </head>
  <body>
    <h1>Snapcast Client</h1>
    <!--<form action="/post" method="post" , id="deviceSettings">-->
      <div class="setting">
        <label for="deviceName">Device Name:</label><br />
        <input
          type="string"
          id="deviceName"
          name="deviceName"
          value="%deviceName_value%"
        />
      </div>
      
      <div class="setting">
        <label for="snapCastIP">Snapcast IP:</label><br />
      
        <input
          type="string"
          id="snapCastIP"
          name="snapCastIP"
          value="%snapCastIP_value%"
        />
      </div>
      
      <div class="setting">
        <label for="snapCastPort">Snapcast Port:</label><br />
        <input
          type="number"
          id="snapCastPort"
          name="snapCastPort"
          value="1234"
        />
      </div>
      
      <div class="setting">
        <label for="ssid">SSID:</label><br />
      
        <input
          type="string"
          id="ssid"
          name="ssid"
          value="%ssid_value%"
        /><br />
      </div>
    
    <div class="setting">
        <label for="ssidPassword">SSID Password:</label><br />
        <input
          type="string"
          id="ssidPassword"
          name="ssidPassword    "
          value="%ssidPassword_value%"
        /><br />
      </div>
     
    <div class="breaker"></div>
     <div class="setting">
        <label for="channel">Channel Configuration</label><br />
        <input
            type="radio" id="stereo" name="channel" value="stereo">
            <label for="stereo">Stereo</label><br>
       
        <input 
            type="radio" id="left" name="channel" value="left">
            <label for="left">Left</label><br>
        
        <input 
            type="radio" id="right" name="channel" value="right">
            <label for="right">Right</label><br />
      </div>
     <div class="breaker"></div>

      
    <!--</form>-->
<br/>



    <!--<button form="deviceSettings" onclick="sendUpdateConfig()" class="buttonstyled">Save</button>-->
    <button onclick="sendUpdateConfig()" class="buttonstyled">Save</button>


    
	<script>
		function sendUpdateConfig() {
      var deviceName = document.getElementById("deviceName").value;
      var snapCastIP = document.getElementById("snapCastIP").value;
      var snapCastPort = document.getElementById("snapCastPort").value;
      var ssid = document.getElementById("ssid").value;
      var ssidPassword = document.getElementById("ssidPassword").value;
      var channel = getRadioVal("channel");
      
      var postCommand = "/post?deviceName=" + deviceName + 
                        "&snapCastIP=" + snapCastIP +
                        "&snapCastPort=" + snapCastPort +
                        "&ssid=" + ssid +
                        "&ssidPassword=" + ssidPassword +
                        "&channel=" + channel;
			
			console.log(postCommand);
			var httpRequest = new XMLHttpRequest();
			httpRequest.open("POST", postCommand , true);
			httpRequest.send();
		}


    function getRadioVal(radioName) 
    {
      var rads = document.getElementsByName(radioName);

      for(var rad in rads) {
        if(rads[rad].checked)
          return rads[rad].value;
      }

      return null;  
    }

   </script> 
  </body>
</html>
